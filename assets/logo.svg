<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050e18"/>
      <stop offset="100%" stop-color="#0b1e32"/>
    </linearGradient>
    <linearGradient id="cryoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5d4"/>
      <stop offset="50%" stop-color="#00bbf9"/>
      <stop offset="100%" stop-color="#4361ee"/>
    </linearGradient>
    <linearGradient id="chipGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2ec4b6"/>
      <stop offset="100%" stop-color="#20a4f3"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Base Badge -->
  <rect width="500" height="500" rx="100" fill="url(#bgGrad)"/>
  <rect width="492" height="492" x="4" y="4" rx="96" fill="none" stroke="#00f5d4" stroke-width="2" stroke-opacity="0.3"/>

  <!-- Cryogenic Hexagonal Snowflake Perimeter -->
  <polygon points="250,75 390,155 390,315 250,395 110,315 110,155" fill="#0d243c" stroke="url(#cryoGrad)" stroke-width="5" filter="url(#glow)"/>

  <!-- Snowflake Branch Extensions -->
  <line x1="250" y1="75" x2="250" y2="395" stroke="#00f5d4" stroke-width="3" stroke-opacity="0.5"/>
  <line x1="110" y1="155" x2="390" y2="315" stroke="#00f5d4" stroke-width="3" stroke-opacity="0.5"/>
  <line x1="110" y1="315" x2="390" y2="155" stroke="#00f5d4" stroke-width="3" stroke-opacity="0.5"/>

  <!-- ESP32-S3 Microcontroller Silicon Die Frame -->
  <rect x="175" y="165" width="150" height="150" rx="22" fill="#0a192c" stroke="url(#chipGrad)" stroke-width="4" filter="url(#glow)"/>

  <!-- Chip Pin Leads -->
  <line x1="155" y1="200" x2="175" y2="200" stroke="#00f5d4" stroke-width="3"/>
  <line x1="155" y1="240" x2="175" y2="240" stroke="#00f5d4" stroke-width="3"/>
  <line x1="155" y1="280" x2="175" y2="280" stroke="#00f5d4" stroke-width="3"/>
  <line x1="325" y1="200" x2="345" y2="200" stroke="#00f5d4" stroke-width="3"/>
  <line x1="325" y1="240" x2="345" y2="240" stroke="#00f5d4" stroke-width="3"/>
  <line x1="325" y1="280" x2="345" y2="280" stroke="#00f5d4" stroke-width="3"/>

  <!-- eFuse Hardware Security Lock & Keyhole Glyph -->
  <rect x="220" y="225" width="60" height="48" rx="10" fill="#143454" stroke="#00f5d4" stroke-width="3"/>
  <path d="M 230 225 L 230 205 A 20 20 0 0 1 270 205 L 270 225" fill="none" stroke="#00f5d4" stroke-width="4" stroke-linecap="round"/>
  <circle cx="250" cy="245" r="5" fill="#ffffff" filter="url(#glow)"/>
  <line x1="250" y1="250" x2="250" y2="260" stroke="#ffffff" stroke-width="3"/>
</svg>
